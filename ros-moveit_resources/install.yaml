- type: ros
  humble:
    source:
      type: git
      url: https://github.com/ros-planning/moveit_resources.git
      version: humble
  jazzy:
    # moveit_resources has no 'jazzy' branch; upstream moveit/moveit_resources uses
    # the distro-agnostic 'ros2' branch for current ROS2 distros (jazzy/rolling).
    # TODO(jazzy): verify on a jazzy workspace.
    source:
      type: git
      url: https://github.com/moveit/moveit_resources.git
      version: ros2
  default:
    source:
      type: git
      url: git@github.com:CardiffUniversityComputationalRobotics/moveit_resources.git
      version: master