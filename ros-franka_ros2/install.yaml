- type: ros
  source:
    type: git
    # url: https://github.com/CardiffUniversityComputationalRobotics/franka_ros2.git
    # version: cucr_branch
    # version: ioannis_dev
    url: https://github.com/frankarobotics/franka_ros2.git
    # Sim-only pin (Apr 2026): v2.1.0 chosen as the last tag without
    # breaking changes affecting fsa2 code (v2.2.0 renamed arm_id →
    # robot_type). v2.3.0 removes the buggy custom franka_ign_ros2_control
    # plugin entirely, BUT on Humble's Ignition Fortress the stock
    # gz_ros2_control doesn't honour URDF mimic in physics (bullet-
    # featherstone engine isn't shipped on Humble), so v2.3.0's promise
    # of mimic-just-works doesn't materialise — the same gripper-fix
    # patches in franka_description are needed at both v2.1.0 and v2.3.0.
    # Given that, v2.1.0 wins on package count: fewer source repos pulled
    # in, no third-party header drift in franka_semantic_components, and
    # the missing-controller_interface-dep fix is in place at v2.1.0.
    # Pairs with libfranka 0.18.0 and franka_description (CUCR fork
    # branch ioannis_dev, which carries patches based on tag 1.4.0).
    # Real-robot constraint: physical FR3 is locked to FCI server v6
    # which caps libfranka at 0.13.x — this pin is incompatible with
    # talking to the real arm and must live in a sim-only workspace.
    version: v2.1.0
    # version: v2.3.0   # newer; same gripper limitations on Humble
    # version: v0.1.15  # last libfranka-0.13.x compatible (real-robot path)
    # version: v0.1.9
    # version: humble