# Environment of NVlabs GraspGen (inference), used by the cucr-env target `graspgen`. GraspGen itself and its pip
# dependencies are installed afterwards by install.bash. CUDA 12.1 compiler + gcc 11 (CUDA 12.1 does not support the
# system gcc 13) are in the environment to build the pointnet2_ops CUDA extension.
name: graspgen
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip=24.2
  - gxx_linux-64=11.4
  - cuda-version=12.1
  - cuda-nvcc
  - cuda-cudart-dev
  - cuda-nvrtc-dev
  - libcublas-dev
  - libcusparse-dev
  - libcusolver-dev
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - --find-links https://data.pyg.org/whl/torch-2.1.0+cu121.html
      - torch==2.1.0+cu121
      - torchvision==0.16.0+cu121
      - torch-cluster==1.6.3+pt21cu121
      - torch-scatter==2.1.2+pt21cu121
      - numpy==1.26.4
      - setuptools==75.1.0
