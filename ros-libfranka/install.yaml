- type: ros
  humble:
    source:
      type: git
      # url: https://github.com/frankaemika/libfranka.git
      # version: 0.13.3 # uses cmake 3.4 which is not supported anymore by cmake (min version is now 3.5)
      # url: https://github.com/CardiffUniversityComputationalRobotics/libfranka.git
      # change version in install.bash instead
      # version: ioannis_dev # 0.13.3 but with cmake 3.5 min
      url: https://github.com/frankaemika/libfranka.git
      # Sim-only pin (Apr 2026): paired with franka_ros2 v2.1.0 which
      # requires libfranka >= 0.18.0. v2.1.0 was chosen over v2.3.0 to
      # keep the colcon source-build set lighter (no source ros2_controllers
      # mega-repo, no third-party header drift). Gripper still needs the
      # mimic-disable + both-fingers-in-ros2_control patches in
      # franka_description; those live in the CUCR fork, branch ioannis_dev.
      # The physical FR3 is locked to FCI server v6 which caps libfranka at
      # 0.13.x, so this pin is incompatible with the real arm and must live
      # in a sim-only workspace once we split.
      version: 0.18.0
      # version: 0.20.4  # paired with franka_ros2 v2.3.0
      # version: 0.13.2  # required by FCI server v6 on the physical robot
      # type: system
      # name: libfranka # apt provides newer libfranka but on Humble it
      # tracks the apt-shipped franka_ros2 minor, which we are not using
  default:
    source:
      type: system
      name: libfranka
