# EfficientSAM (yformer/EfficientSAM) — default promptable segmenter for iris
# perception Stage 1. Depends on torch; the package has setup.py so it is
# pip-installable from git. The bundled checkpoints (weights/efficient_sam_vitt.pt
# direct, weights/efficient_sam_vits.pt zipped) are NOT shipped by pip — install.bash
# fetches + unzips them and exports EFFICIENT_SAM_ROOT for the loader.
- type: target
  name: python3-pytorch-pip

- type: pip
  name: git+https://github.com/yformer/EfficientSAM.git
