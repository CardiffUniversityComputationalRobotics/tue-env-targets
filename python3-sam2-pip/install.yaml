# SAM2 (facebookresearch/sam2) — higher-quality promptable segmenter, selectable as
# the iris perception segmenter backend (segmenter.backend: sam2_large). pip-installable
# from git; uses the modern torch from python3-pytorch-pip (NOT the old 1.10.2). Weights
# load via HuggingFace from_pretrained; install.bash pre-fetches the Hiera-Large ckpt.
- type: target
  name: python3-pytorch-pip

- type: pip
  name: git+https://github.com/facebookresearch/sam2.git

- type: pip
  name: huggingface_hub
